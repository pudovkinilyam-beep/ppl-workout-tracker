<script>

<script>
  window.storage = {
    async get(key, shared) {
      const v = localStorage.getItem(key);
      if (v === null) return null;
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem(key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: !!shared };
    }
  };
</script>

<script>
const PROGRAMS_JSON = `{"august":{"push":[{"id":"0025","name":"Жим штанги лёжа","nameEn":"barbell bench press","target":"pectorals","equipment":"barbell","instructions":"Лягте на скамью, поставьте ступни на землю и прижмите спину к скамье. Возьмите штангу хватом сверху на расстоянии чуть шире плеч. Снимите штангу со стойки и держите ее прямо над грудью, полностью вытянув руки. Медленно опустите штангу к груди, держа локти прижатыми. Сделайте паузу на мгновение, когда штанга коснется вашей груди. Верните штангу в исходное положение, вытянув руки. Повторите необходимое количество повторений.","sets":"4","reps":"8-10","rest":120,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Bench_Press_-_Medium_Grip/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Bench_Press_-_Medium_Grip/1.jpg"],"sourceName":"Barbell Bench Press - Medium Grip","recMin":60,"recMax":75,"recNote":"от штанги весом тела начни с разминки, рабочие 60-75 кг на 8-10 повторов"},{"id":"a001","name":"Жим Арнольда","nameEn":"arnold dumbbell press","target":"delts","equipment":"dumbbell","instructions":"Сядьте на скамью, возьмите гантели, ладони обращены к вам, локти согнуты, гантели у плеч. Одновременно разворачивайте кисти наружу и выжимайте гантели вверх, пока руки полностью не выпрямятся. Ладони в верхней точке смотрят вперёд. Медленно опустите гантели, разворачивая кисти обратно, в исходное положение. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Arnold_Dumbbell_Press/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Arnold_Dumbbell_Press/1.jpg"],"sourceName":"Arnold Dumbbell Press","recMin":12,"recMax":18,"recNote":"вес одной гантели"},{"id":"a002","name":"Армейский жим стоя","nameEn":"standing military press","target":"delts","equipment":"barbell","instructions":"Встаньте прямо, ноги на ширине плеч. Возьмите штангу хватом чуть шире плеч, поднимите её на грудь. Напрягите корпус, ягодицы и ноги. Выжмите штангу вертикально вверх над головой, полностью выпрямив руки. Немного отклоните голову вперёд в верхней точке, чтобы гриф прошёл над лицом. Медленно опустите штангу обратно на грудь. Повторите необходимое количество повторений.","sets":"4","reps":"6-8","rest":120,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Military_Press/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Military_Press/1.jpg"],"sourceName":"Standing Military Press","recMin":35,"recMax":45,"recNote":"рабочий вес штанги (включая гриф)"},{"id":"a003","name":"Face Pull на блоке","nameEn":"face pull","target":"delts","equipment":"cable","instructions":"Прикрепите канатную рукоять к верхнему блоку. Встаньте лицом к тренажёру, возьмитесь за концы каната сверху ладонями вниз. Отойдите на шаг, руки полностью вытянуты. Потяните канат на себя к уровню лица, разводя руки в стороны так, чтобы локти были высоко и на одной линии с плечами. Сведите лопатки в верхней точке, задержитесь на секунду. Медленно вернитесь в исходное положение. Повторите необходимое количество повторений.","sets":"3","reps":"15-20","rest":45,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Face_Pull/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Face_Pull/1.jpg"],"sourceName":"Face Pull","recMin":15,"recMax":25,"recNote":"вес стека; вес меньше — техника важнее"},{"id":"a004","name":"Жим гантелей лёжа","nameEn":"dumbbell bench press","target":"pectorals","equipment":"dumbbell","instructions":"Лягте на скамью, поставьте ноги на землю и плотно прижмите спину к скамье. Возьмите по гантели в каждую руку ладонями вперёд и поднимите их на высоту груди, локти согнуты под 90 градусов. Выжмите гантели вверх до полного выпрямления рук, сближая их в верхней точке. Медленно опустите гантели по бокам груди, контролируя движение. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Bench_Press/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Bench_Press/1.jpg"],"sourceName":"Dumbbell Bench Press","recMin":24,"recMax":32,"recNote":"вес одной гантели"},{"id":"0060","name":"Французский жим штанги лёжа","nameEn":"barbell lying triceps extension skull crusher","target":"triceps","equipment":"barbell","instructions":"Лягте на скамью, положив ноги на землю, а голову на край скамьи. Возьмите штангу хватом сверху, руки на ширине плеч, вытяните руки вверх над грудью. Удерживая плечи неподвижно, медленно опустите штангу ко лбу, сгибая локти. Сделайте паузу на мгновение, когда штанга окажется прямо над лбом, затем вытяните руки обратно в исходное положение. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":60,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/EZ-Bar_Skullcrusher/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/EZ-Bar_Skullcrusher/1.jpg"],"sourceName":"EZ-Bar Skullcrusher","recMin":20,"recMax":30,"recNote":"суммарный вес штанги/EZ-грифа без учёта веса самого грифа"},{"id":"0241","name":"Разгибание рук на блоке (трицепс)","nameEn":"cable triceps pushdown (v-bar)","target":"triceps","equipment":"cable","instructions":"Прикрепите V-образную насадку к тросовому станку на самой высокой скорости. Встаньте лицом к канатному тренажеру, поставив ноги на ширине плеч. Возьмитесь за V-образную перекладину хватом сверху, ладонями вниз, руки на ширине плеч. На протяжении всего упражнения держите локти близко к бокам, а плечи неподвижными. Задействуйте трицепсы и на выдохе опускайте V-образную планку вниз, пока руки полностью не выпрямятся. Задержитесь на мгновение в нижней части движения, напрягая трицепсы. На вдохе медленно возвращайте V-образную планку в исходное положение, сохраняя контроль. Повторите необходимое количество повторений.","sets":"3","reps":"12-15","rest":45,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Triceps_Pushdown_-_V-Bar_Attachment/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Triceps_Pushdown_-_V-Bar_Attachment/1.jpg"],"sourceName":"Triceps Pushdown - V-Bar Attachment","recMin":25,"recMax":35,"recNote":"вес стека"}],"pull":[{"id":"1429","name":"Подтягивания широким хватом","nameEn":"wide grip pull-up","target":"lats","equipment":"body weight","instructions":"Повисните на перекладине, повернув ладонями от себя и расставив руки на ширине плеч. Напрягите корпус и сведите лопатки вместе. Подтягивайте тело к перекладине, пока подбородок не окажется над перекладиной. Опустите тело обратно в исходное положение, контролируя его. Повторите необходимое количество повторений.","sets":"4","reps":"8-10","rest":120,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pullups/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pullups/1.jpg"],"sourceName":"Pullups","recMin":0,"recMax":0,"recNote":"свой вес тела; если 8-10 чистых подтягиваний пока тяжело — используй тренажёр гравитрон (компенсация 15-25 кг)"},{"id":"0027","name":"Тяга штанги в наклоне","nameEn":"barbell bent over row","target":"upper back","equipment":"barbell","instructions":"Встаньте, ноги на ширине плеч и слегка согнуты в коленях. Наклонитесь вперед в бедрах, сохраняя спину прямой и грудь вверх. Возьмите штангу хватом сверху, руки на расстоянии чуть шире плеч. Потяните штангу к нижней части груди, сводя лопатки и напрягая мышцы спины. Задержитесь на мгновение в верхней точке, затем медленно опустите штангу обратно в исходное положение. Повторите необходимое количество повторений.","sets":"4","reps":"8-10","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Barbell_Row/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Barbell_Row/1.jpg"],"sourceName":"Bent Over Barbell Row","recMin":50,"recMax":65,"recNote":"рабочий вес штанги"},{"id":"a005","name":"Тяга Т-грифа","nameEn":"t-bar row with handle","target":"upper back","equipment":"barbell","instructions":"Встаньте над Т-грифом, поставьте ноги по бокам от грифа. Наклонитесь вперёд с прямой спиной, слегка согните колени. Возьмитесь за рукоять, руки полностью вытянуты. Потяните гриф вверх к нижней части груди, сводя лопатки и напрягая спину. Задержитесь на мгновение в верхней точке, затем медленно опустите гриф в исходное положение. Держите корпус неподвижным на протяжении движения. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/T-Bar_Row_with_Handle/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/T-Bar_Row_with_Handle/1.jpg"],"sourceName":"T-Bar Row with Handle","recMin":30,"recMax":45,"recNote":"вес блинов на грифе"},{"id":"a006","name":"Тяга верхнего блока широким хватом","nameEn":"wide-grip lat pulldown","target":"lats","equipment":"cable","instructions":"Сядьте в тренажёр, закрепите колени валиками. Возьмитесь за перекладину широким хватом, ладони от себя. Слегка отклонитесь назад, грудь вверх. Потяните перекладину вниз к верхней части груди, сводя лопатки и напрягая широчайшие. Задержитесь на мгновение в нижней точке. Медленно верните перекладину вверх, полностью выпрямив руки, контролируя вес. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Wide-Grip_Lat_Pulldown/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Wide-Grip_Lat_Pulldown/1.jpg"],"sourceName":"Wide-Grip Lat Pulldown","recMin":45,"recMax":60,"recNote":"вес стека"},{"id":"a007","name":"Разведение на блоках (задние дельты)","nameEn":"cable rear delt fly","target":"delts","equipment":"cable","instructions":"Встаньте между двух блочных стоек, установите рукояти на уровне плеч. Возьмите правой рукой левый трос, левой — правый (руки скрещены). Сохраняя небольшой изгиб в локтях, разведите руки в стороны и назад до уровня плеч. Сожмите лопатки в конечной точке. Медленно верните руки в исходное скрещенное положение. Повторите необходимое количество повторений.","sets":"3","reps":"12-15","rest":45,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Rear_Delt_Fly/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Rear_Delt_Fly/1.jpg"],"sourceName":"Cable Rear Delt Fly","recMin":8,"recMax":14,"recNote":"вес на каждом блоке"},{"id":"0031","name":"Подъём штанги на бицепс стоя","nameEn":"barbell curl","target":"biceps","equipment":"barbell","instructions":"Встаньте прямо, ноги на ширине плеч, возьмите штангу обратным хватом ладонями вперед. Держите локти близко к туловищу и выдыхайте, сгибая штангу и одновременно сокращая бицепсы. Продолжайте поднимать штангу до тех пор, пока ваши бицепсы полностью не сократятся и штанга не окажется на уровне плеч. Задержитесь в сокращенном положении на короткую паузу, одновременно сжимая бицепсы. На вдохе начните медленно опускать штангу обратно в исходное положение. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":60,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Curl/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Curl/1.jpg"],"sourceName":"Barbell Curl","recMin":25,"recMax":35,"recNote":"рабочий вес штанги"},{"id":"a008","name":"Сгибание рук на скамье Скотта","nameEn":"preacher curl","target":"biceps","equipment":"barbell","instructions":"Сядьте за скамью Скотта, прижмите плечи к наклонной подушке. Возьмите штангу или EZ-гриф обратным хватом, руки полностью выпрямлены. Согните руки, поднимая гриф к плечам, максимально напрягая бицепс в верхней точке. Задержитесь на мгновение. Медленно опустите гриф в исходное положение, контролируя вес до полного растяжения бицепса. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":60,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Preacher_Curl/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Preacher_Curl/1.jpg"],"sourceName":"Preacher Curl","recMin":15,"recMax":25,"recNote":"рабочий вес штанги/EZ-грифа"}],"legs":[{"id":"0043","name":"Приседания со штангой","nameEn":"barbell full squat","target":"glutes","equipment":"barbell","instructions":"Встаньте, ноги на ширине плеч, носки слегка развернуты наружу. Держите штангу на верхней части спины, опираясь на трапеции или задние дельты. Напрягите корпус и держите грудь поднятой, когда начинаете опускать тело вниз. Согните колени и бедра, отводя бедра назад и вниз, как будто вы сидите на стуле. Опускайтесь до тех пор, пока бедра не станут параллельны земле или немного ниже. Держите колени на одной линии с пальцами ног, а вес тела перенесите на пятки. Протолкните пятки, чтобы встать обратно, выпрямляя бедра и колени. Повторите необходимое количество повторений.","sets":"4","reps":"8-10","rest":150,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Squat/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Squat/1.jpg"],"sourceName":"Barbell Squat","recMin":70,"recMax":90,"recNote":"рабочий вес штанги (без учёта веса грифа уже включён)"},{"id":"0085","name":"Румынская тяга со штангой","nameEn":"barbell romanian deadlift","target":"glutes","equipment":"barbell","instructions":"Встаньте, поставив ноги на ширине плеч, носки ног направлены вперед. Возьмите штангу хватом сверху, руки чуть шире плеч. Согните бедра, сохраняя спину прямой и слегка согнутыми в коленях. Опустите штангу к земле, держа ее близко к телу. Почувствуйте растяжение подколенных сухожилий, когда опускаете штангу. Как только вы почувствуете растяжение подколенных сухожилий, выдвиньте бедра вперед и встаньте прямо. Напрягите ягодицы в верхней точке движения. Опустите штангу обратно в исходное положение и повторите желаемое количество повторений.","sets":"4","reps":"8-10","rest":120,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Romanian_Deadlift/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Romanian_Deadlift/1.jpg"],"sourceName":"Romanian Deadlift","recMin":70,"recMax":90,"recNote":"рабочий вес штанги"},{"id":"2287","name":"Жим ногами в тренажёре","nameEn":"lever alternate leg press","target":"quads","equipment":"leverage machine","instructions":"Отрегулируйте сиденье и платформу для ног рычажной машины в желаемое положение. Сядьте на тренажер, прислонившись спиной к спинке и поставив ноги на платформу для ног. Положите руки на ручки или по бокам машины для устойчивости. Упритесь одной ногой в платформу для ног, вытягивая ногу до тех пор, пока она не станет почти полностью прямой. Сделайте паузу на мгновение, затем медленно согните ногу и вернитесь в исходное положение. Повторите с другой ногой. Продолжайте чередовать ноги желаемое количество повторений.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Press/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Press/1.jpg"],"sourceName":"Leg Press","recMin":140,"recMax":180,"recNote":"суммарный вес на платформе тренажёра"},{"id":"a009","name":"Болгарский сплит-присед","nameEn":"split squat with dumbbells","target":"quads","equipment":"dumbbell","instructions":"Встаньте спиной к скамье, держите гантели в руках. Поставьте одну ногу носком на скамью позади себя, вторая — впереди в шаге. Опустите тело вниз, сгибая переднюю ногу до параллели бедра с полом. Держите корпус вертикально, колено передней ноги не выходит за носок. Оттолкнитесь пяткой передней ноги, чтобы вернуться в исходное положение. Выполните все повторения на одну ногу, затем поменяйте сторону.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Split_Squat_with_Dumbbells/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Split_Squat_with_Dumbbells/1.jpg"],"sourceName":"Split Squat with Dumbbells","recMin":10,"recMax":16,"recNote":"вес одной гантели; на каждую ногу отдельно"},{"id":"a010","name":"Разгибание ног в тренажёре","nameEn":"leg extensions","target":"quads","equipment":"machine","instructions":"Сядьте в тренажёр, прижмите спину к спинке. Поместите ноги под валик так, чтобы он касался щиколоток. Возьмитесь за ручки по бокам. Разогните ноги в коленях, поднимая валик до полного выпрямления. Максимально напрягите квадрицепс в верхней точке, задержитесь на мгновение. Медленно опустите валик вниз, контролируя движение. Повторите необходимое количество повторений.","sets":"3","reps":"12-15","rest":60,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Extensions/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Extensions/1.jpg"],"sourceName":"Leg Extensions","recMin":30,"recMax":45,"recNote":"вес стека"},{"id":"1372","name":"Подъём на носки стоя со штангой","nameEn":"barbell standing calf raise","target":"calves","equipment":"barbell","instructions":"Встаньте, ноги на ширине плеч, положите штангу на верхнюю часть спины. Поднимите пятки от земли как можно выше, используя только пальцы ног. Задержитесь на мгновение в верхней точке, затем медленно опустите пятки обратно в исходное положение. Повторите необходимое количество повторений.","sets":"4","reps":"15-20","rest":45,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Barbell_Calf_Raise/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Barbell_Calf_Raise/1.jpg"],"sourceName":"Standing Barbell Calf Raise","recMin":40,"recMax":60,"recNote":"доп. вес сверх штанги"},{"id":"a011","name":"Планка на локтях","nameEn":"plank","target":"abs","equipment":"body only","instructions":"Примите положение упор лёжа на локтях: локти под плечами, предплечья на полу, ноги на носках. Тело от макушки до пяток образует прямую линию. Напрягите пресс, ягодицы, квадрицепсы. Не прогибайтесь в пояснице и не поднимайте таз. Дышите ровно. Удерживайте позицию заявленное количество секунд. Если тяжело — начните с 30 секунд.","sets":"3","reps":"60с","rest":60,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/1.jpg"],"sourceName":"Plank","recMin":0,"recMax":0,"recNote":"вес собственного тела; цель — 60 секунд в подходе"}]},"september":{"push":[{"id":"0025","name":"Жим штанги лёжа","nameEn":"barbell bench press","target":"pectorals","equipment":"barbell","instructions":"Лягте на скамью, поставьте ступни на землю и прижмите спину к скамье. Возьмите штангу хватом сверху на расстоянии чуть шире плеч. Снимите штангу со стойки и держите ее прямо над грудью, полностью вытянув руки. Медленно опустите штангу к груди, держа локти прижатыми. Сделайте паузу на мгновение, когда штанга коснется вашей груди. Верните штангу в исходное положение, вытянув руки. Повторите необходимое количество повторений.","sets":"4","reps":"8-10","rest":120,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Bench_Press_-_Medium_Grip/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Bench_Press_-_Medium_Grip/1.jpg"],"sourceName":"Barbell Bench Press - Medium Grip","recMin":60,"recMax":75,"recNote":"от штанги весом тела начни с разминки, рабочие 60-75 кг на 8-10 повторов"},{"id":"a001","name":"Жим Арнольда","nameEn":"arnold dumbbell press","target":"delts","equipment":"dumbbell","instructions":"Сядьте на скамью, возьмите гантели, ладони обращены к вам, локти согнуты, гантели у плеч. Одновременно разворачивайте кисти наружу и выжимайте гантели вверх, пока руки полностью не выпрямятся. Ладони в верхней точке смотрят вперёд. Медленно опустите гантели, разворачивая кисти обратно, в исходное положение. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Arnold_Dumbbell_Press/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Arnold_Dumbbell_Press/1.jpg"],"sourceName":"Arnold Dumbbell Press","recMin":12,"recMax":18,"recNote":"вес одной гантели"},{"id":"a002","name":"Армейский жим стоя","nameEn":"standing military press","target":"delts","equipment":"barbell","instructions":"Встаньте прямо, ноги на ширине плеч. Возьмите штангу хватом чуть шире плеч, поднимите её на грудь. Напрягите корпус, ягодицы и ноги. Выжмите штангу вертикально вверх над головой, полностью выпрямив руки. Немного отклоните голову вперёд в верхней точке, чтобы гриф прошёл над лицом. Медленно опустите штангу обратно на грудь. Повторите необходимое количество повторений.","sets":"4","reps":"6-8","rest":120,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Military_Press/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Military_Press/1.jpg"],"sourceName":"Standing Military Press","recMin":35,"recMax":45,"recNote":"рабочий вес штанги (включая гриф)"},{"id":"a003","name":"Face Pull на блоке","nameEn":"face pull","target":"delts","equipment":"cable","instructions":"Прикрепите канатную рукоять к верхнему блоку. Встаньте лицом к тренажёру, возьмитесь за концы каната сверху ладонями вниз. Отойдите на шаг, руки полностью вытянуты. Потяните канат на себя к уровню лица, разводя руки в стороны так, чтобы локти были высоко и на одной линии с плечами. Сведите лопатки в верхней точке, задержитесь на секунду. Медленно вернитесь в исходное положение. Повторите необходимое количество повторений.","sets":"3","reps":"15-20","rest":45,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Face_Pull/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Face_Pull/1.jpg"],"sourceName":"Face Pull","recMin":15,"recMax":25,"recNote":"вес стека; вес меньше — техника важнее"},{"id":"a004","name":"Жим гантелей лёжа","nameEn":"dumbbell bench press","target":"pectorals","equipment":"dumbbell","instructions":"Лягте на скамью, поставьте ноги на землю и плотно прижмите спину к скамье. Возьмите по гантели в каждую руку ладонями вперёд и поднимите их на высоту груди, локти согнуты под 90 градусов. Выжмите гантели вверх до полного выпрямления рук, сближая их в верхней точке. Медленно опустите гантели по бокам груди, контролируя движение. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Bench_Press/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Bench_Press/1.jpg"],"sourceName":"Dumbbell Bench Press","recMin":24,"recMax":32,"recNote":"вес одной гантели"},{"id":"0060","name":"Французский жим штанги лёжа","nameEn":"barbell lying triceps extension skull crusher","target":"triceps","equipment":"barbell","instructions":"Лягте на скамью, положив ноги на землю, а голову на край скамьи. Возьмите штангу хватом сверху, руки на ширине плеч, вытяните руки вверх над грудью. Удерживая плечи неподвижно, медленно опустите штангу ко лбу, сгибая локти. Сделайте паузу на мгновение, когда штанга окажется прямо над лбом, затем вытяните руки обратно в исходное положение. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":60,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/EZ-Bar_Skullcrusher/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/EZ-Bar_Skullcrusher/1.jpg"],"sourceName":"EZ-Bar Skullcrusher","recMin":20,"recMax":30,"recNote":"суммарный вес штанги/EZ-грифа без учёта веса самого грифа"},{"id":"0241","name":"Разгибание рук на блоке (трицепс)","nameEn":"cable triceps pushdown (v-bar)","target":"triceps","equipment":"cable","instructions":"Прикрепите V-образную насадку к тросовому станку на самой высокой скорости. Встаньте лицом к канатному тренажеру, поставив ноги на ширине плеч. Возьмитесь за V-образную перекладину хватом сверху, ладонями вниз, руки на ширине плеч. На протяжении всего упражнения держите локти близко к бокам, а плечи неподвижными. Задействуйте трицепсы и на выдохе опускайте V-образную планку вниз, пока руки полностью не выпрямятся. Задержитесь на мгновение в нижней части движения, напрягая трицепсы. На вдохе медленно возвращайте V-образную планку в исходное положение, сохраняя контроль. Повторите необходимое количество повторений.","sets":"3","reps":"12-15","rest":45,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Triceps_Pushdown_-_V-Bar_Attachment/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Triceps_Pushdown_-_V-Bar_Attachment/1.jpg"],"sourceName":"Triceps Pushdown - V-Bar Attachment","recMin":25,"recMax":35,"recNote":"вес стека"},{"id":"b001","name":"Скручивания на блоке с поворотом","nameEn":"kneeling cable crunch with oblique twists","target":"abs","equipment":"cable","instructions":"Встань на колени перед верхним блоком, возьми канатную рукоять и заведи её за голову. Скругли спину, выдохни и опустись вниз, коснувшись локтями бёдер. В нижней точке поверни корпус в сторону — сначала левым локтем к правому бедру, следующее повторение наоборот. Удерживай сокращение на 1 секунду. Медленно вернись в исходное положение. Работай прессом, не руками.","sets":"3","reps":"12-15","rest":45,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Kneeling_Cable_Crunch_With_Alternating_Oblique_Twists/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Kneeling_Cable_Crunch_With_Alternating_Oblique_Twists/1.jpg"],"sourceName":"Kneeling Cable Crunch With Alternating Oblique Twists","recMin":20,"recMax":35,"recNote":"вес стека; техника важнее веса"},{"id":"b002","name":"Русские скручивания","nameEn":"russian twist","target":"abs","equipment":"body only","instructions":"Сядь на пол, согни колени, слегка отклонись назад так, чтобы почувствовать напряжение в прессе. Ступни можно оторвать от пола для сложности или оставить на полу. Сложи руки перед собой или возьми блин/гантель для веса. Поворачивай корпус вправо и влево, касаясь пола (или веса) сбоку от бедра. Одно повторение — поворот в обе стороны. Работай корпусом, не махай руками.","sets":"3","reps":"20 (по 10 в сторону)","rest":30,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Russian_Twist/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Russian_Twist/1.jpg"],"sourceName":"Russian Twist","recMin":0,"recMax":10,"recNote":"начни без веса; потом бери гантель 5-10 кг"},{"id":"cardio-push","name":"Кардио-финишер (5-10 мин)","nameEn":"cardio finisher","target":"abs","equipment":"any","instructions":"Выбери один снаряд: велотренажёр, гребной тренажёр, беговая дорожка или скакалка. Держи темп на уровне 6-7 из 10 — тяжело говорить полными предложениями, но не задыхаешься. 5-10 минут без остановки. Можно вариант интервалов: 30 секунд быстро, 30 секунд медленно. Цель — добить сердечно-сосудистую систему, ускорить восстановление и сжечь дополнительные калории. НЕ выполняй до силовой работы — иначе не будет сил на подходы.","sets":"1","reps":"5-10 мин","rest":0,"images":[],"sourceName":"Cardio finisher","recMin":0,"recMax":0,"recNote":"любой снаряд; темп 6-7 из 10"}],"pull":[{"id":"1429","name":"Подтягивания широким хватом","nameEn":"wide grip pull-up","target":"lats","equipment":"body weight","instructions":"Повисните на перекладине, повернув ладонями от себя и расставив руки на ширине плеч. Напрягите корпус и сведите лопатки вместе. Подтягивайте тело к перекладине, пока подбородок не окажется над перекладиной. Опустите тело обратно в исходное положение, контролируя его. Повторите необходимое количество повторений.","sets":"4","reps":"8-10","rest":120,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pullups/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pullups/1.jpg"],"sourceName":"Pullups","recMin":0,"recMax":0,"recNote":"свой вес тела; если 8-10 чистых подтягиваний пока тяжело — используй тренажёр гравитрон (компенсация 15-25 кг)"},{"id":"0027","name":"Тяга штанги в наклоне","nameEn":"barbell bent over row","target":"upper back","equipment":"barbell","instructions":"Встаньте, ноги на ширине плеч и слегка согнуты в коленях. Наклонитесь вперед в бедрах, сохраняя спину прямой и грудь вверх. Возьмите штангу хватом сверху, руки на расстоянии чуть шире плеч. Потяните штангу к нижней части груди, сводя лопатки и напрягая мышцы спины. Задержитесь на мгновение в верхней точке, затем медленно опустите штангу обратно в исходное положение. Повторите необходимое количество повторений.","sets":"4","reps":"8-10","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Barbell_Row/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Barbell_Row/1.jpg"],"sourceName":"Bent Over Barbell Row","recMin":50,"recMax":65,"recNote":"рабочий вес штанги"},{"id":"a005","name":"Тяга Т-грифа","nameEn":"t-bar row with handle","target":"upper back","equipment":"barbell","instructions":"Встаньте над Т-грифом, поставьте ноги по бокам от грифа. Наклонитесь вперёд с прямой спиной, слегка согните колени. Возьмитесь за рукоять, руки полностью вытянуты. Потяните гриф вверх к нижней части груди, сводя лопатки и напрягая спину. Задержитесь на мгновение в верхней точке, затем медленно опустите гриф в исходное положение. Держите корпус неподвижным на протяжении движения. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/T-Bar_Row_with_Handle/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/T-Bar_Row_with_Handle/1.jpg"],"sourceName":"T-Bar Row with Handle","recMin":30,"recMax":45,"recNote":"вес блинов на грифе"},{"id":"a006","name":"Тяга верхнего блока широким хватом","nameEn":"wide-grip lat pulldown","target":"lats","equipment":"cable","instructions":"Сядьте в тренажёр, закрепите колени валиками. Возьмитесь за перекладину широким хватом, ладони от себя. Слегка отклонитесь назад, грудь вверх. Потяните перекладину вниз к верхней части груди, сводя лопатки и напрягая широчайшие. Задержитесь на мгновение в нижней точке. Медленно верните перекладину вверх, полностью выпрямив руки, контролируя вес. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Wide-Grip_Lat_Pulldown/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Wide-Grip_Lat_Pulldown/1.jpg"],"sourceName":"Wide-Grip Lat Pulldown","recMin":45,"recMax":60,"recNote":"вес стека"},{"id":"a007","name":"Разведение на блоках (задние дельты)","nameEn":"cable rear delt fly","target":"delts","equipment":"cable","instructions":"Встаньте между двух блочных стоек, установите рукояти на уровне плеч. Возьмите правой рукой левый трос, левой — правый (руки скрещены). Сохраняя небольшой изгиб в локтях, разведите руки в стороны и назад до уровня плеч. Сожмите лопатки в конечной точке. Медленно верните руки в исходное скрещенное положение. Повторите необходимое количество повторений.","sets":"3","reps":"12-15","rest":45,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Rear_Delt_Fly/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Rear_Delt_Fly/1.jpg"],"sourceName":"Cable Rear Delt Fly","recMin":8,"recMax":14,"recNote":"вес на каждом блоке"},{"id":"0031","name":"Подъём штанги на бицепс стоя","nameEn":"barbell curl","target":"biceps","equipment":"barbell","instructions":"Встаньте прямо, ноги на ширине плеч, возьмите штангу обратным хватом ладонями вперед. Держите локти близко к туловищу и выдыхайте, сгибая штангу и одновременно сокращая бицепсы. Продолжайте поднимать штангу до тех пор, пока ваши бицепсы полностью не сократятся и штанга не окажется на уровне плеч. Задержитесь в сокращенном положении на короткую паузу, одновременно сжимая бицепсы. На вдохе начните медленно опускать штангу обратно в исходное положение. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":60,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Curl/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Curl/1.jpg"],"sourceName":"Barbell Curl","recMin":25,"recMax":35,"recNote":"рабочий вес штанги"},{"id":"a008","name":"Сгибание рук на скамье Скотта","nameEn":"preacher curl","target":"biceps","equipment":"barbell","instructions":"Сядьте за скамью Скотта, прижмите плечи к наклонной подушке. Возьмите штангу или EZ-гриф обратным хватом, руки полностью выпрямлены. Согните руки, поднимая гриф к плечам, максимально напрягая бицепс в верхней точке. Задержитесь на мгновение. Медленно опустите гриф в исходное положение, контролируя вес до полного растяжения бицепса. Повторите необходимое количество повторений.","sets":"3","reps":"10-12","rest":60,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Preacher_Curl/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Preacher_Curl/1.jpg"],"sourceName":"Preacher Curl","recMin":15,"recMax":25,"recNote":"рабочий вес штанги/EZ-грифа"},{"id":"b003","name":"Подъём ног в висе","nameEn":"hanging leg raise","target":"abs","equipment":"body only","instructions":"Повисни на перекладине хватом сверху, руки на ширине плеч. Держи плечи активными (не расслабляй в суставах). Напряги пресс и подними прямые (или слегка согнутые) ноги вверх до уровня бёдер параллельно полу или выше. Не раскачивайся — движение должно идти от пресса, а не по инерции. Задержись в верхней точке на секунду, затем медленно опусти ноги. Если тяжело с прямыми ногами — начинай с согнутых в коленях.","sets":"3","reps":"10-15","rest":60,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hanging_Leg_Raise/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hanging_Leg_Raise/1.jpg"],"sourceName":"Hanging Leg Raise","recMin":0,"recMax":0,"recNote":"свой вес; если тяжело — согни колени"},{"id":"b004","name":"Dead Bug (мёртвый жук)","nameEn":"dead bug","target":"abs","equipment":"body only","instructions":"Ляг на спину, руки вытяни вверх к потолку, ноги согни в коленях под 90 градусов (голени параллельны полу). Прижми поясницу к полу — она НЕ должна отрываться на протяжении всего упражнения. Одновременно опусти правую руку за голову и левую ногу к полу (не касаясь). Медленно вернись в исходное положение и повтори с другой стороной. Работай прессом-стабилизатором, дыши ровно. Одно повторение — обе стороны.","sets":"3","reps":"10 (по 5 на сторону)","rest":45,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dead_Bug/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dead_Bug/1.jpg"],"sourceName":"Dead Bug","recMin":0,"recMax":0,"recNote":"свой вес; поясница прижата, медленный контроль"},{"id":"cardio-pull","name":"Кардио-финишер (5-10 мин)","nameEn":"cardio finisher","target":"abs","equipment":"any","instructions":"Выбери один снаряд: велотренажёр, гребной тренажёр, беговая дорожка или скакалка. Держи темп на уровне 6-7 из 10 — тяжело говорить полными предложениями, но не задыхаешься. 5-10 минут без остановки. Можно вариант интервалов: 30 секунд быстро, 30 секунд медленно. Цель — добить сердечно-сосудистую систему, ускорить восстановление и сжечь дополнительные калории. НЕ выполняй до силовой работы — иначе не будет сил на подходы.","sets":"1","reps":"5-10 мин","rest":0,"images":[],"sourceName":"Cardio finisher","recMin":0,"recMax":0,"recNote":"любой снаряд; темп 6-7 из 10"}],"legs":[{"id":"0043","name":"Приседания со штангой","nameEn":"barbell full squat","target":"glutes","equipment":"barbell","instructions":"Встаньте, ноги на ширине плеч, носки слегка развернуты наружу. Держите штангу на верхней части спины, опираясь на трапеции или задние дельты. Напрягите корпус и держите грудь поднятой, когда начинаете опускать тело вниз. Согните колени и бедра, отводя бедра назад и вниз, как будто вы сидите на стуле. Опускайтесь до тех пор, пока бедра не станут параллельны земле или немного ниже. Держите колени на одной линии с пальцами ног, а вес тела перенесите на пятки. Протолкните пятки, чтобы встать обратно, выпрямляя бедра и колени. Повторите необходимое количество повторений.","sets":"4","reps":"8-10","rest":150,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Squat/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Squat/1.jpg"],"sourceName":"Barbell Squat","recMin":70,"recMax":90,"recNote":"рабочий вес штанги (без учёта веса грифа уже включён)"},{"id":"0085","name":"Румынская тяга со штангой","nameEn":"barbell romanian deadlift","target":"glutes","equipment":"barbell","instructions":"Встаньте, поставив ноги на ширине плеч, носки ног направлены вперед. Возьмите штангу хватом сверху, руки чуть шире плеч. Согните бедра, сохраняя спину прямой и слегка согнутыми в коленях. Опустите штангу к земле, держа ее близко к телу. Почувствуйте растяжение подколенных сухожилий, когда опускаете штангу. Как только вы почувствуете растяжение подколенных сухожилий, выдвиньте бедра вперед и встаньте прямо. Напрягите ягодицы в верхней точке движения. Опустите штангу обратно в исходное положение и повторите желаемое количество повторений.","sets":"4","reps":"8-10","rest":120,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Romanian_Deadlift/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Romanian_Deadlift/1.jpg"],"sourceName":"Romanian Deadlift","recMin":70,"recMax":90,"recNote":"рабочий вес штанги"},{"id":"2287","name":"Жим ногами в тренажёре","nameEn":"lever alternate leg press","target":"quads","equipment":"leverage machine","instructions":"Отрегулируйте сиденье и платформу для ног рычажной машины в желаемое положение. Сядьте на тренажер, прислонившись спиной к спинке и поставив ноги на платформу для ног. Положите руки на ручки или по бокам машины для устойчивости. Упритесь одной ногой в платформу для ног, вытягивая ногу до тех пор, пока она не станет почти полностью прямой. Сделайте паузу на мгновение, затем медленно согните ногу и вернитесь в исходное положение. Повторите с другой ногой. Продолжайте чередовать ноги желаемое количество повторений.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Press/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Press/1.jpg"],"sourceName":"Leg Press","recMin":140,"recMax":180,"recNote":"суммарный вес на платформе тренажёра"},{"id":"a009","name":"Болгарский сплит-присед","nameEn":"split squat with dumbbells","target":"quads","equipment":"dumbbell","instructions":"Встаньте спиной к скамье, держите гантели в руках. Поставьте одну ногу носком на скамью позади себя, вторая — впереди в шаге. Опустите тело вниз, сгибая переднюю ногу до параллели бедра с полом. Держите корпус вертикально, колено передней ноги не выходит за носок. Оттолкнитесь пяткой передней ноги, чтобы вернуться в исходное положение. Выполните все повторения на одну ногу, затем поменяйте сторону.","sets":"3","reps":"10-12","rest":90,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Split_Squat_with_Dumbbells/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Split_Squat_with_Dumbbells/1.jpg"],"sourceName":"Split Squat with Dumbbells","recMin":10,"recMax":16,"recNote":"вес одной гантели; на каждую ногу отдельно"},{"id":"a010","name":"Разгибание ног в тренажёре","nameEn":"leg extensions","target":"quads","equipment":"machine","instructions":"Сядьте в тренажёр, прижмите спину к спинке. Поместите ноги под валик так, чтобы он касался щиколоток. Возьмитесь за ручки по бокам. Разогните ноги в коленях, поднимая валик до полного выпрямления. Максимально напрягите квадрицепс в верхней точке, задержитесь на мгновение. Медленно опустите валик вниз, контролируя движение. Повторите необходимое количество повторений.","sets":"3","reps":"12-15","rest":60,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Extensions/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Leg_Extensions/1.jpg"],"sourceName":"Leg Extensions","recMin":30,"recMax":45,"recNote":"вес стека"},{"id":"1372","name":"Подъём на носки стоя со штангой","nameEn":"barbell standing calf raise","target":"calves","equipment":"barbell","instructions":"Встаньте, ноги на ширине плеч, положите штангу на верхнюю часть спины. Поднимите пятки от земли как можно выше, используя только пальцы ног. Задержитесь на мгновение в верхней точке, затем медленно опустите пятки обратно в исходное положение. Повторите необходимое количество повторений.","sets":"4","reps":"15-20","rest":45,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Barbell_Calf_Raise/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Barbell_Calf_Raise/1.jpg"],"sourceName":"Standing Barbell Calf Raise","recMin":40,"recMax":60,"recNote":"доп. вес сверх штанги"},{"id":"a011","name":"Планка на локтях","nameEn":"plank","target":"abs","equipment":"body only","instructions":"Примите положение упор лёжа на локтях: локти под плечами, предплечья на полу, ноги на носках. Тело от макушки до пяток образует прямую линию. Напрягите пресс, ягодицы, квадрицепсы. Не прогибайтесь в пояснице и не поднимайте таз. Дышите ровно. Удерживайте позицию заявленное количество секунд. Если тяжело — начните с 30 секунд.","sets":"3","reps":"60с","rest":60,"images":["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/0.jpg","https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/1.jpg"],"sourceName":"Plank","recMin":0,"recMax":0,"recNote":"вес собственного тела; цель — 60 секунд в подходе"},{"id":"cardio-legs","name":"Кардио-финишер (5-10 мин)","nameEn":"cardio finisher","target":"abs","equipment":"any","instructions":"Выбери один снаряд: велотренажёр, гребной тренажёр, беговая дорожка или скакалка. Держи темп на уровне 6-7 из 10 — тяжело говорить полными предложениями, но не задыхаешься. 5-10 минут без остановки. Можно вариант интервалов: 30 секунд быстро, 30 секунд медленно. Цель — добить сердечно-сосудистую систему, ускорить восстановление и сжечь дополнительные калории. НЕ выполняй до силовой работы — иначе не будет сил на подходы.","sets":"1","reps":"5-10 мин","rest":0,"images":[],"sourceName":"Cardio finisher","recMin":0,"recMax":0,"recNote":"любой снаряд; темп 6-7 из 10"}]}}`;

const DEFAULT_PROGRAM = PROGRAM_META[PROGRAM_META.length - 1].key;

const DAY_META = {
  push: { label: "PUSH", sub: "Грудь · Плечи · Трицепс", code: "01", ru: "Жим" },
  pull: { label: "PULL", sub: "Спина · Бицепс · Зад. дельты", code: "02", ru: "Тяга" },
  legs: { label: "LEGS", sub: "Ноги · Ягодицы · Кор", code: "03", ru: "Ноги" },
};

const TARGET_RU = {
  pectorals: "грудь", delts: "дельты", triceps: "трицепс", lats: "широчайшие",
  "upper back": "верх спины", biceps: "бицепс", glutes: "ягодицы", quads: "квадрицепс",
  hamstrings: "бицепс бедра", calves: "икры", abs: "пресс",
};

const todayKey = () => new Date().toISOString().slice(0, 10);

// EX_INDEX содержит упражнения из ВСЕХ программ — чтобы История всегда знала метаданные
// (иначе после переключения программы старые упражнения потеряли бы имя/тип дня)
const EX_INDEX = {};
Object.keys(PROGRAMS).forEach((pkey) => {
  Object.keys(PROGRAMS[pkey]).forEach((d) => {
    PROGRAMS[pkey][d].forEach((ex) => {
      // Первое встреченное имеет приоритет — не переписываем, чтобы порядок META был устойчивым
      if (!EX_INDEX[ex.id]) EX_INDEX[ex.id] = { ...ex, dayType: d, programs: [pkey] };
      else EX_INDEX[ex.id].programs.push(pkey);
    });
  });
});

const RU_MONTHS = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const RU_WEEKDAYS = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];

function fmtDateRu(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return `${RU_WEEKDAYS[d.getDay()]}, ${d.getDate()} ${RU_MONTHS[d.getMonth()]}`;
}

function weekKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow);
  return d.toISOString().slice(0, 10);
}

function fmtClock(s) {
  const m = Math.floor(s / 60).toString().padStart(2, "0");
  const r = Math.floor(s % 60).toString().padStart(2, "0");
  return `${m}:${r}`;
}

function youtubeSearchUrl(nameEn) {
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(nameEn + " exercise tutorial form")}`;
}

async function loadLog(exId) {
  try {
    const res = await window.storage.get(`log:${exId}`, false);
    return res ? JSON.parse(res.value) : null;
  } catch {
    return null;
  }
}

async function saveLog(exId, data) {
  try {
    await window.storage.set(`log:${exId}`, JSON.stringify(data), false);
  } catch (e) {
    console.error("storage set failed", e);
  }
}

function ExPhoto({ src, alt, className }) {
  const [failed, setFailed] = React.useState(false);
  if (failed || !src) {
    return (
      <div className={`${className} photo-fallback`}>
        <svg viewBox="0 0 24 24" width="40%" height="40%">
          <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" strokeWidth="1.4" />
          <path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
        </svg>
      </div>
    );
  }
  return <img src={src} alt={alt} className={className} loading="lazy" onError={() => setFailed(true)} />;
}

function ExerciseCard({ ex, index, onStartRest, onProgress }) {
  const numSets = parseInt(ex.sets, 10);
  const [rows, setRows] = React.useState(
    Array.from({ length: numSets }, () => ({ weight: "", reps: "", done: false }))
  );
  const [lastSession, setLastSession] = React.useState(null);
  const [maxWeightEver, setMaxWeightEver] = React.useState(null); // рекорд по этому упражнению
  const [open, setOpen] = React.useState(false);
  const [saved, setSaved] = React.useState(false);
  const [photoPhase, setPhotoPhase] = React.useState(0);
  const [lightbox, setLightbox] = React.useState(false);

  React.useEffect(() => {
    let mounted = true;
    (async () => {
      const log = await loadLog(ex.id);
      if (mounted && log) {
        setLastSession(log.history && log.history.length ? log.history[log.history.length - 1] : null);
        if (log.date === todayKey() && log.rows) {
          setRows(log.rows);
          setSaved(true);
        }
        // Считаем максимум по истории
        if (Array.isArray(log.history)) {
          let mx = 0;
          log.history.forEach(h => {
            (h.rows || []).forEach(r => {
              const w = parseFloat(r.weight);
              if (!isNaN(w) && w > mx) mx = w;
            });
          });
          setMaxWeightEver(mx > 0 ? mx : null);
        }
      }
    })();
    return () => { mounted = false; };
  }, [ex.id]);

  // Сообщаем родителю о прогрессе
  React.useEffect(() => {
    if (onProgress) onProgress(ex.id, rows.filter(r => r.done).length);
  }, [rows, ex.id, onProgress]);

  const updateRow = (i, field, val) => {
    setRows((prev) => {
      const next = [...prev];
      next[i] = { ...next[i], [field]: val };
      return next;
    });
    setSaved(false);
  };

  const toggleDone = (i) => {
    const wasDone = rows[i].done;
    updateRow(i, "done", !wasDone);
    // Автостарт таймера отдыха при отметке подхода (не последнего, не при снятии галки)
    if (!wasDone && ex.rest > 0 && i < numSets - 1 && onStartRest) {
      onStartRest(ex.rest, ex.name);
    }
  };

  const handleSave = async () => {
    const existing = await loadLog(ex.id);
    const history = existing && Array.isArray(existing.history) ? existing.history.filter(h => h.date !== todayKey()) : [];
    const completed = rows.filter(r => r.weight !== "" || r.reps !== "");
    if (completed.length) history.push({ date: todayKey(), rows: completed });
    const trimmed = history.slice(-60);
    await saveLog(ex.id, {
      date: todayKey(), rows, history: trimmed,
      meta: {
        name: ex.name,
        dayType: (EX_INDEX[ex.id] && EX_INDEX[ex.id].dayType) || null,
        sets: ex.sets, target: ex.target
      }
    });
    setLastSession(trimmed.length ? trimmed[trimmed.length - 1] : null);
    setSaved(true);
  };

  const doneCount = rows.filter(r => r.done).length;
  const allDone = doneCount === numSets;
  const photos = ex.images || [];

  return (
    <div className={`ex-card ${allDone ? "ex-card--done" : ""}`}>
      <div className="ex-head" onClick={() => setOpen(!open)}>
        <ExPhoto src={photos[0]} alt={ex.nameEn} className="ex-thumb" />
        <div className="ex-headtext">
          <div className="ex-name">{ex.name}</div>
          <div className="ex-meta">
            <span className="ex-target">{TARGET_RU[ex.target] || ex.target}</span>
            <span className="dot">·</span>
            <span>{ex.sets}×{ex.reps}</span>
            <span className="dot">·</span>
            <span>отдых {ex.rest}с</span>
          </div>
        </div>
        <div className="ex-progress">{doneCount}/{numSets}</div>
        <div className={`chev ${open ? "chev--open" : ""}`}>▾</div>
      </div>

      {open && (
        <div className="ex-body">
          <div className="ex-photo-block">
            <div className="ex-photo-big" onClick={() => setLightbox(true)}>
              <ExPhoto src={photos[photoPhase]} alt={ex.nameEn} className="ex-photo-img" />
              <div className="ex-photo-zoom">⤢</div>
            </div>
            {photos.length > 1 && (
              <div className="photo-toggle">
                {photos.map((_, i) => (
                  <button
                    key={i}
                    className={`phase-btn ${photoPhase === i ? "phase-btn--on" : ""}`}
                    onClick={() => setPhotoPhase(i)}
                  >
                    {i === 0 ? "Старт" : "Финал"}
                  </button>
                ))}
              </div>
            )}
            <a className="video-link" href={youtubeSearchUrl(ex.nameEn)} target="_blank" rel="noopener noreferrer">
              ▶ Видео техники на YouTube
            </a>
          </div>

          <div className="rec-weight">
            <span className="rec-label">Стартовый вес</span>
            <span className="rec-value">
              {ex.recMin === 0 && ex.recMax === 0 ? "вес тела" : `${ex.recMin}–${ex.recMax} кг`}
            </span>
            <span className="rec-note">{ex.recNote}</span>
          </div>

          <p className="ex-instr">{ex.instructions}</p>

          {lastSession && (
            <div className="ex-last">
              Прошлый раз ({lastSession.date.slice(5)}):{" "}
              {lastSession.rows.map((r, i) => (
                <span key={i} className="last-chip">{r.weight || "—"}кг×{r.reps || "—"}</span>
              ))}
            </div>
          )}

          <div className="set-table">
            <div className="set-row set-row--header">
              <span>Подход</span><span>Вес, кг</span><span>Повторы</span><span></span>
            </div>
            {rows.map((row, i) => {
              const w = parseFloat(row.weight);
              const isPR = !isNaN(w) && maxWeightEver !== null && w > maxWeightEver;
              return (
                <div className={`set-row ${row.done ? "set-row--done" : ""}`} key={i}>
                  <span className="set-idx">{i + 1}</span>
                  <input
                    type="number" inputMode="decimal"
                    className={isPR ? "input--pr" : ""}
                    placeholder={lastSession?.rows?.[i]?.weight || (ex.recMax ? `~${Math.round((ex.recMin + ex.recMax) / 2)}` : "—")}
                    value={row.weight}
                    onChange={(e) => updateRow(i, "weight", e.target.value)}
                  />
                  <input
                    type="number" inputMode="numeric"
                    placeholder={lastSession?.rows?.[i]?.reps || ex.reps.split("-")[0]}
                    value={row.reps}
                    onChange={(e) => updateRow(i, "reps", e.target.value)}
                  />
                  <button className={`check ${row.done ? "check--on" : ""}`} onClick={() => toggleDone(i)} aria-label={row.done ? "Отменить" : "Отметить подход"}>
                    {row.done ? "✓" : "○"}
                  </button>
                </div>
              );
            })}
          </div>

          <div className="ex-actions">
            {ex.rest > 0 && (
              <button className="btn-rest" onClick={() => onStartRest && onStartRest(ex.rest, ex.name)}>
                ⏱ Отдых {ex.rest}с
              </button>
            )}
            <button className="btn-save" onClick={handleSave}>
              {saved ? "Сохранено" : "Сохранить подходы"}
            </button>
          </div>
        </div>
      )}

      {lightbox && (
        <div className="lightbox" onClick={() => setLightbox(false)}>
          <ExPhoto src={photos[photoPhase]} alt={ex.nameEn} className="lightbox-img" />
        </div>
      )}
    </div>
  );
}

const DAY_ACCENT = { push: "var(--rust)", pull: "var(--olive)", legs: "#c99a4a" };

function WeekChart({ buckets }) {
  const max = Math.max(3, ...buckets.map((b) => b.count));
  return (
    <div className="week-chart">
      {buckets.map((b, i) => (
        <div className="week-bar-col" key={i}>
          <div className="week-bar-track">
            <div className="week-bar-fill" style={{ height: `${(b.count / max) * 100}%` }} />
          </div>
          <div className="week-bar-count">{b.count}</div>
          <div className="week-bar-label">{b.label}</div>
        </div>
      ))}
    </div>
  );
}

function CalendarMonth({ date, sessions }) {
  const [selectedDate, setSelectedDate] = React.useState(null);
  const year = date.getFullYear();
  const month = date.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const daysInMonth = lastDay.getDate();
  const startingDayOfWeek = firstDay.getDay();

  const trainingDates = new Set(sessions.map(s => s.date));

  const days = [];
  for (let i = 0; i < startingDayOfWeek; i++) days.push(null);
  for (let i = 1; i <= daysInMonth; i++) days.push(i);

  const selectedSession = selectedDate ? sessions.find(s => s.date === selectedDate) : null;

  return (
    <div className="calendar-month">
      <div className="calendar-header">{RU_MONTHS[month]} {year}</div>
      <div className="calendar-weekdays">
        {RU_WEEKDAYS.map(d => <div key={d} className="weekday">{d}</div>)}
      </div>
      <div className="calendar-grid">
        {days.map((day, i) => {
          if (day === null) return <div key={`empty-${i}`} className="calendar-day empty" />;
          const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const hasTraining = trainingDates.has(dateStr);
          return (
            <button
              key={dateStr}
              className={`calendar-day ${hasTraining ? "has-training" : ""} ${selectedDate === dateStr ? "selected" : ""}`}
              onClick={() => setSelectedDate(selectedDate === dateStr ? null : dateStr)}
            >
              <div className="cal-day-num">{day}</div>
              {hasTraining && <div className="cal-indicator">●</div>}
            </button>
          );
        })}
      </div>
      {selectedSession && (
        <div className="calendar-detail">
          <div className="detail-date">{fmtDateRu(selectedSession.date)}</div>
          {selectedSession.entries.map((e) => (
            <div className="detail-ex" key={e.exId}>
              <div className="detail-name">{e.name}</div>
              <div className="detail-sets">
                {e.rows.map((r, i) => (
                  <span key={i} className="detail-chip">{r.weight || "—"}кг × {r.reps || "—"}повтор</span>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function HistoryView() {
  const [loading, setLoading] = React.useState(true);
  const [sessions, setSessions] = React.useState([]);
  const [stats, setStats] = React.useState({ total: 0, thisWeek: 0, buckets: [], progress: { up: 0, down: 0, flat: 0 } });

  React.useEffect(() => {
    let mounted = true;
    (async () => {
      // Собираю все ключи log:* из хранилища, а не только те, что в EX_INDEX,
      // чтобы история из старых программ (например, июль) не терялась
      const allKeys = await window.storage.list("log:", false);
      const ids = (allKeys && allKeys.keys ? allKeys.keys : []).map(k => k.replace(/^log:/, ""));
      // Гарантирую, что все текущие упражнения тоже в списке (на случай если storage.list вернёт пусто)
      Object.keys(EX_INDEX).forEach(id => { if (!ids.includes(id)) ids.push(id); });
      const logs = await Promise.all(ids.map((id) => loadLog(id)));

      // Сборный "индекс" метаданных: сначала из текущей программы, затем из log.meta для старых
      const metaByEx = {};
      ids.forEach((id, i) => {
        if (EX_INDEX[id]) metaByEx[id] = { name: EX_INDEX[id].name, dayType: EX_INDEX[id].dayType, sets: EX_INDEX[id].sets };
        else if (logs[i] && logs[i].meta) metaByEx[id] = { name: logs[i].meta.name || id, dayType: logs[i].meta.dayType || "push", sets: logs[i].meta.sets || "3" };
        else metaByEx[id] = { name: id, dayType: "push", sets: "3" };
      });

      const flat = [];
      ids.forEach((id, i) => {
        const log = logs[i];
        if (!log || !Array.isArray(log.history)) return;
        log.history.forEach((h) => {
          if (h.rows && h.rows.length) flat.push({ exId: id, date: h.date, rows: h.rows });
        });
      });

      const byEx = {};
      flat.forEach((r) => { (byEx[r.exId] = byEx[r.exId] || []).push(r); });
      Object.values(byEx).forEach((arr) => {
        arr.sort((a, b) => (a.date < b.date ? -1 : 1));
        arr.forEach((r, i) => {
          const avg = (rows) => {
            const vals = rows.map((x) => parseFloat(x.weight)).filter((v) => !isNaN(v));
            return vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : null;
          };
          const cur = avg(r.rows);
          const prev = i > 0 ? avg(arr[i - 1].rows) : null;
          r.delta = cur !== null && prev !== null ? Math.round((cur - prev) * 10) / 10 : null;
        });
      });

      const byDate = {};
      flat.forEach((r) => {
        const meta = metaByEx[r.exId] || { name: r.exId, dayType: "push", sets: "3" };
        (byDate[r.date] = byDate[r.date] || []).push({
          exId: r.exId, name: meta.name, dayType: meta.dayType,
          plannedSets: parseInt(meta.sets, 10) || 3, rows: r.rows, delta: r.delta ?? null,
        });
      });

      const dates = Object.keys(byDate).sort((a, b) => (a < b ? 1 : -1));
      const sessionsBuilt = dates.map((date) => {
        const entries = byDate[date];
        const counts = {};
        entries.forEach((e) => { counts[e.dayType] = (counts[e.dayType] || 0) + 1; });
        const dayType = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
        const plannedTotal = entries.reduce((s, e) => s + e.plannedSets, 0);
        return { date, dayType, entries, plannedTotal };
      });

      const today = new Date();
      const wBuckets = [];
      for (let i = 7; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i * 7);
        const wk = weekKey(d.toISOString().slice(0, 10));
        const count = dates.filter((dt) => weekKey(dt) === wk).length;
        wBuckets.push({ label: `${new Date(wk).getDate()}.${new Date(wk).getMonth() + 1}`, count, wk });
      }
      const thisWeek = dates.filter((dt) => weekKey(dt) === weekKey(todayKey())).length;

      // Прогресс: для каждого упражнения с ≥2 сессиями сравниваю средний вес последней и первой из последних 4 сессий
      let up = 0, down = 0, flat_cnt = 0;
      Object.entries(byEx).forEach(([exId, arr]) => {
        if (arr.length < 2) return;
        const avg = (rows) => {
          const vals = rows.map((x) => parseFloat(x.weight)).filter((v) => !isNaN(v) && v > 0);
          return vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : null;
        };
        const recent = arr.slice(-4);
        const first = avg(recent[0].rows);
        const last = avg(recent[recent.length - 1].rows);
        if (first === null || last === null) return;
        const diff = last - first;
        if (diff > 0.5) up++;
        else if (diff < -0.5) down++;
        else flat_cnt++;
      });

      if (mounted) {
        setSessions(sessionsBuilt);
        setStats({ total: dates.length, thisWeek, buckets: wBuckets, progress: { up, down, flat: flat_cnt } });
        setLoading(false);
      }
    })();
    return () => { mounted = false; };
  }, []);

  if (loading) return <div className="hist-empty">Загружаю историю…</div>;

  if (!sessions.length) {
    return (
      <div className="hist-empty">
        Пока нет сохранённых тренировок.<br />
        Заполни подходы на вкладке «Тренировка» и нажми «Сохранить подходы» — здесь появится прогресс по дням.
      </div>
    );
  }

  const today = new Date();
  const currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const prevMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);

  return (
    <div className="hist">
      <div className="hist-stats">
        <div className="stat-card">
          <div className="stat-value">{stats.total}</div>
          <div className="stat-label">тренировок всего</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{stats.thisWeek}/3</div>
          <div className="stat-label">на этой неделе</div>
        </div>
      </div>

      {(stats.progress.up + stats.progress.down + stats.progress.flat) > 0 && (
        <>
          <div className="hist-block-title">Прогресс (последние 4 тренировки на упражнение)</div>
          <div className="progress-summary">
            <div className="prog-cell prog-cell--up">
              <div className="prog-icon">▲</div>
              <div className="prog-num">{stats.progress.up}</div>
              <div className="prog-lab">растут</div>
            </div>
            <div className="prog-cell prog-cell--flat">

              <div className="prog-num">{stats.progress.flat}</div>
              <div className="prog-lab">стабильны</div>
            </div>
            <div className="prog-cell prog-cell--down">
              <div className="prog-icon">▼</div>
              <div className="prog-num">{stats.progress.down}</div>
              <div className="prog-lab">упали</div>
            </div>
          </div>
        </>
      )}

      <div className="hist-block-title">По неделям</div>
      <WeekChart buckets={stats.buckets} />

      <div className="hist-block-title">Календарь тренировок</div>
      <div className="calendars-grid">
        {(() => {
          const monthsToShow = [currentMonth, prevMonth].filter(m => {
            const yr = m.getFullYear();
            const mo = m.getMonth();
            return sessions.some(s => {
              const d = new Date(s.date + "T00:00:00");
              return d.getFullYear() === yr && d.getMonth() === mo;
            });
          });
          return monthsToShow.length ? monthsToShow.map((m, i) => (
            <CalendarMonth key={i} date={m} sessions={sessions} />
          )) : <CalendarMonth date={currentMonth} sessions={sessions} />;
        })()}
      </div>

      <div className="hist-block-title">Все тренировки</div>
      <div className="sess-list">
        {sessions.map((s) => (
          <SessionCard key={s.date} date={s.date} dayType={s.dayType} entries={s.entries} plannedTotal={s.plannedTotal} />
        ))}
      </div>
    </div>
  );
}

function RestTimerOverlay({ state, onAdjust, onClose }) {
  const { remaining, total, exName } = state;
  const finished = remaining <= 0;
  const pct = total > 0 ? Math.max(0, Math.min(100, (remaining / total) * 100)) : 0;

  // Автозакрытие через 5 секунд после нуля
  React.useEffect(() => {
    if (!finished) return;
    const t = setTimeout(onClose, 5000);
    return () => clearTimeout(t);
  }, [finished, onClose]);

  // Ring SVG
  const R = 120, C = 2 * Math.PI * R;
  const dash = C * (1 - pct / 100);

  return (
    <div className="rest-overlay" role="dialog" aria-modal="true">
      <button className="rest-close" onClick={onClose} aria-label="Закрыть">×</button>

      <div className="rest-title">{finished ? "Отдых окончен" : "Отдых"}</div>
      {exName && <div className="rest-ex">{exName}</div>}

      <div className="rest-ring-wrap">
        <svg className="rest-ring" viewBox="0 0 280 280" width="280" height="280">
          <circle cx="140" cy="140" r={R} fill="none" stroke="var(--surface2)" strokeWidth="10" />
          <circle
            cx="140" cy="140" r={R} fill="none"
            stroke={finished ? "var(--olive)" : "var(--rust)"}
            strokeWidth="10" strokeLinecap="round"
            strokeDasharray={C} strokeDashoffset={dash}
            transform="rotate(-90 140 140)"
            style={{ transition: "stroke-dashoffset 0.5s linear, stroke 0.3s ease" }}
          />
        </svg>
        <div className={`rest-time ${finished ? "rest-time--done" : ""}`}>
          {finished ? "GO" : fmtClock(remaining)}
        </div>
      </div>

      <div className="rest-controls">
        <button className="rest-btn" onClick={() => onAdjust(-15)} disabled={finished}>−15с</button>
        <button className="rest-btn rest-btn--primary" onClick={onClose}>
          {finished ? "Продолжить" : "Пропустить"}
        </button>
        <button className="rest-btn" onClick={() => onAdjust(15)}>+15с</button>
      </div>
    </div>
  );
}

function WorkoutApp() {
  const [programKey, setProgramKey] = React.useState(() => {
    try {
      const saved = localStorage.getItem("activeProgram");
      if (saved && PROGRAMS[saved]) return saved;
    } catch {}
    return DEFAULT_PROGRAM;
  });
  const [day, setDay] = React.useState("push");
  const [mode, setMode] = React.useState("train");
  const [theme, setTheme] = React.useState(() => {
    try {
      const saved = localStorage.getItem("theme");
      return saved === "light" ? "light" : "dark";
    } catch { return "dark"; }
  });

  // Глобальный таймер отдыха: один на всё приложение
  const [restTimer, setRestTimer] = React.useState(null); // { remaining, total, exName } | null
  const restIntervalRef = React.useRef(null);

  // Прогресс дня: { exId: doneCount }
  const [dayProgress, setDayProgress] = React.useState({});
  const updateExProgress = React.useCallback((exId, done) => {
    setDayProgress(p => (p[exId] === done ? p : { ...p, [exId]: done }));
  }, []);

  React.useEffect(() => {
    try { localStorage.setItem("activeProgram", programKey); } catch {}
    // При смене программы сбрасываем прогресс (карточки пересоздадутся)
    setDayProgress({});
  }, [programKey]);

  React.useEffect(() => {
    try { localStorage.setItem("theme", theme); } catch {}
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  // Тик таймера отдыха
  React.useEffect(() => {
    if (!restTimer || restTimer.remaining <= 0) {
      if (restIntervalRef.current) { clearInterval(restIntervalRef.current); restIntervalRef.current = null; }
      return;
    }
    restIntervalRef.current = setInterval(() => {
      setRestTimer(t => {
        if (!t) return null;
        const next = t.remaining - 1;
        if (next <= 0) {
          // Вибрация + звук при окончании
          try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]); } catch {}
          return { ...t, remaining: 0 };
        }
        return { ...t, remaining: next };
      });
    }, 1000);
    return () => { if (restIntervalRef.current) clearInterval(restIntervalRef.current); };
  }, [restTimer && restTimer.remaining > 0]);

  const startRest = React.useCallback((seconds, exName) => {
    if (!seconds || seconds <= 0) return;
    setRestTimer({ remaining: seconds, total: seconds, exName: exName || "" });
  }, []);
  const adjustRest = React.useCallback((delta) => {
    setRestTimer(t => t ? { ...t, remaining: Math.max(0, t.remaining + delta), total: Math.max(t.total, t.remaining + delta) } : null);
  }, []);
  const closeRest = React.useCallback(() => setRestTimer(null), []);

  const program = PROGRAMS[programKey] || {};
  const exercises = program[day] || [];

  // Прогресс тренировки: подходов сделано / всего в текущем дне
  const plannedSetsInDay = exercises.reduce((s, ex) => s + (parseInt(ex.sets, 10) || 0), 0);
  const doneSetsInDay = exercises.reduce((s, ex) => s + (dayProgress[ex.id] || 0), 0);

        .sess-head { padding: 12px; display: flex; gap: 12px; align-items: center; cursor: pointer; transition: background 0.15s ease; }
        .sess-head:active { background: rgba(255,255,255,0.02); }
        .sess-daydot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .sess-headtext { flex: 1; }
        .sess-date { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .sess-badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
        .sess-badge--up { background: rgba(74,222,128,0.14); color: #4ade80; }
        .sess-badge--down { background: rgba(248,113,113,0.14); color: #f87171; }
        .sess-sub { font-size: 12px; color: var(--chalk-dim); margin-top: 2px; }

        .sess-body { padding: 12px; border-top: 1px solid var(--line); background: rgba(0,0,0,0.1); }
        .sess-ex { margin-bottom: 8px; }
        .sess-ex-name { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .delta { font-size: 11px; font-weight: 600; }
        .delta--up { color: #4ade80; }
        .delta--down { color: #f87171; }
        .delta--flat { color: var(--chalk-dim); }
        .sess-ex-sets { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 11px; }
        .sess-ex-frac { margin-left: auto; color: var(--chalk-dim); }
      `}</style>

      <div className="header">
        <div className="header-top">
          <div>
            <div className="eyebrow">Программа тренировок</div>
            <div className="title">PPL Tracker</div>
            <div className="subtitle">Push / Pull / Legs</div>
          </div>
          <button
            className="theme-toggle"
            onClick={() => setTheme(t => t === "dark" ? "light" : "dark")}
            aria-label={theme === "dark" ? "Светлая тема" : "Тёмная тема"}
            title={theme === "dark" ? "Светлая тема" : "Тёмная тема"}
          >
            {theme === "dark" ? "☀" : "☾"}
          </button>
        </div>

        <div className="prog-switch">
          {PROGRAM_META.map((p) => (
            <button
              key={p.key}
              className={`prog-chip ${programKey === p.key ? "prog-chip--on" : ""}`}
              onClick={() => { setProgramKey(p.key); }}
              title={p.sub}
            >
              {p.label}
            </button>
          ))}
        </div>
      </div>

      <div className="day-rack">
        {Object.keys(program).map((d) => (
          <button
            key={d}
            className={`day-plate ${mode === "train" && day === d ? "day-plate--on" : ""}`}
            onClick={() => { setDay(d); setMode("train"); }}
          >
            <div className="day-plate-name">{DAY_META[d].label}</div>
            <div className="day-plate-sub">{DAY_META[d].ru}</div>
          </button>
        ))}
      </div>

      {mode === "train" && plannedSetsInDay > 0 && (
        <div className="day-progress">
          <div className="day-progress-bar">
            <div
              className="day-progress-fill"
              style={{ width: `${Math.min(100, (doneSetsInDay / plannedSetsInDay) * 100)}%` }}
            />
          </div>
          <div className="day-progress-label">
            {doneSetsInDay}/{plannedSetsInDay} подходов
            {doneSetsInDay === plannedSetsInDay && plannedSetsInDay > 0 && " · тренировка завершена 🔥"}
          </div>
        </div>
      )}

      <div className="view-tabs">
        <button className={`view-tab ${mode === "train" ? "view-tab--on" : ""}`} onClick={() => setMode("train")}>
          Тренировка
        </button>
        <button className={`view-tab ${mode === "history" ? "view-tab--on" : ""}`} onClick={() => setMode("history")}>
          История
        </button>
      </div>

      {mode === "train" && (
        <div className="ex-list">
          {exercises.map((ex, idx) => (
            <ExerciseCard
              key={`${programKey}:${ex.id}`}
              ex={ex}
              index={idx}
              onStartRest={startRest}
              onProgress={updateExProgress}
            />
          ))}
        </div>
      )}

      {mode === "history" && <HistoryView />}

      {restTimer && (
        <RestTimerOverlay
          state={restTimer}
          onAdjust={adjustRest}
          onClose={closeRest}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<WorkoutApp />);

</script>

</body>
</html>
