<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1f1c16"/>
      <stop offset="100%" stop-color="#15130f"/>
    </radialGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d85e35"/>
      <stop offset="100%" stop-color="#a83f1c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4bba6"/>
      <stop offset="50%" stop-color="#8a8072"/>
      <stop offset="100%" stop-color="#625a4e"/>
    </linearGradient>
  </defs>

  <!-- rounded bg -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Штанга: гриф по центру -->
  <rect x="80" y="246" width="352" height="20" rx="6" fill="url(#bar)"/>

  <!-- Внутренние "замки" -->
  <rect x="124" y="226" width="14" height="60" rx="3" fill="url(#bar)"/>
  <rect x="374" y="226" width="14" height="60" rx="3" fill="url(#bar)"/>

  <!-- Большие ржавые блины -->
  <rect x="60" y="166" width="60" height="180" rx="14" fill="url(#plate)"/>
  <rect x="392" y="166" width="60" height="180" rx="14" fill="url(#plate)"/>

  <!-- Внутренние блины поменьше -->
  <rect x="140" y="196" width="30" height="120" rx="8" fill="#8a3a22"/>
  <rect x="342" y="196" width="30" height="120" rx="8" fill="#8a3a22"/>

  <!-- Блик на больших блинах для глубины -->
  <rect x="68" y="174" width="12" height="164" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="400" y="174" width="12" height="164" rx="4" fill="rgba(255,255,255,0.15)"/>
</svg>
